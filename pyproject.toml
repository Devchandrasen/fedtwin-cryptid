[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedtwin-cryptid"
version = "1.0.0"
description = "Raw-media non-export fixed-evidence calibration and signed audit logging for multimedia copy review"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Chandrasen Pandey" }
]
dependencies = [
  "cryptography>=42",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
audio = ["miniaudio>=1.61"]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
all = ["miniaudio>=1.61", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
fedtwin = "fedtwin.cli:main"

[tool.setuptools]
py-modules = ["run_benchmark"]

[tool.setuptools.packages.find]
include = ["fedtwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["fedtwin"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
