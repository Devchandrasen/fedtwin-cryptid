name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Synthetic smoke run
        run: python run_smoke.py --assets 80 --queries 100 --rounds 1 --local-epochs 1 --output-tag ci_smoke
